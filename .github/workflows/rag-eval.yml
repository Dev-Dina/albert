name: RAG Eval

on:
  workflow_call:

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests retrieval ingestion isolation
        run: uv run pytest tests/test_ingestion.py tests/test_retrieval.py tests/test_chunk_isolation.py -v

      - name: Run RAG eval harness
        working-directory: ${{ github.workspace }}
        run: PYTHONPATH=..:. uv run --directory backend python -m evals.rag_eval --golden ../evals/rag_golden.jsonl

      - name: Run tool-selection eval harness
        working-directory: ${{ github.workspace }}
        run: uv run --directory backend python -m evals.tool_selection_eval --golden ../evals/tool_selection.jsonl --thresholds ../evals/eval_thresholds.yaml