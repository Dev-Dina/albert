[project]
name = "albert-modelserver"
version = "0.1.0"
description = "Albert modelserver service shell."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "joblib",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "scikit-learn",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
