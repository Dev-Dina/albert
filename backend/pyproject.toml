[project]
name = "albert-backend"
version = "0.1.0"
description = "Albert backend service shell."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "google-genai",
    "cohere",
    "pgvector",
    "jinja2",
    "pydantic[email]",
    # python-jose is used ONLY by the per-tenant widget-session token system
    # (app/core/security.py); user-login auth is handled by fastapi-users (pwdlib).
    "python-jose[cryptography]",
    "redis[hiredis]",
    "minio",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "fastapi-users[sqlalchemy]>=15",
]
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
