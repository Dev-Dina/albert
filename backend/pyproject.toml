[project]
name = "albert-backend"
version = "0.1.0"
description = "Albert backend service shell."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "google-genai",
    "cohere",
    "pgvector",
    "jinja2",
    "pydantic[email]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    # passlib 1.7.4 is incompatible with bcrypt >=4.1 (reads removed
    # bcrypt.__about__); the lock regen pulled bcrypt 5.0.0. Pin to a
    # passlib-compatible release.
    "bcrypt<4.1",
    "redis[hiredis]",
    "minio",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
]
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
