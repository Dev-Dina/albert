[project]
name = "albert-backend"
version = "0.1.0"
description = "Albert backend service shell."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "redis[hiredis]",
    "minio",
    "pgvector",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiosqlite",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
