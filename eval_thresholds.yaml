# Albert — evaluation thresholds (canonical, repo root).
#
# Single source of truth for CI gate thresholds. Loaded by
# `evals/common/thresholds.py` (Owner D, spec 001-widget-auth-admin-cicd)
# and consumed by every `evals/<gate>/run.py` plus Owner C's `rag_eval.py`
# and `tool_selection_eval.py`. The previous flat-key duplicate at
# `evals/eval_thresholds.yaml` was removed by T086 to remove drift risk.
#
# Safety floor (FR-026, FR-027): `redteam.required_pass_rate` and
# `redaction.required_pass_rate` MUST stay at 1.00. The first CI step
# (`evals/common/validate_thresholds.py`) refuses anything lower.

classifier:
  # DAY 1 PLACEHOLDER — raise when real dataset lands
  macro_f1_min: 0.60

rag:
  # DAY 1 PLACEHOLDER — raise when real dataset lands
  hit_at_5_min: 0.60
  # DAY 1 PLACEHOLDER — raise when real dataset lands
  mrr_min: 0.30

agent_tool_selection:
  # DAY 1 PLACEHOLDER — raise when real dataset lands
  accuracy_min: 0.70

redteam:
  required_pass_rate: 1.00  # safety floor — DO NOT lower (FR-026)

redaction:
  required_pass_rate: 1.00  # safety floor — DO NOT lower (FR-027)

smoke:
  required_pass_rate: 1.00  # basic end-to-end must always pass

ci:
  # Wall-clock budget for the full CI run (lint → typecheck → image_build → smoke
  # → 5 eval gates → summary). Backs SC-006's "team's agreed CI time budget"
  # promise. Soft signal by default: T087 surfaces observed vs threshold in the
  # PR summary; flip to a hard gate (fail the build on exceed) once we have a
  # few weeks of real run-times. 600s ≈ 10 min, the team's stated target.
  total_budget_seconds: 600
